<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Astronaut Portfolio</title>
  <link rel="icon" type="image/x-icon" href="/favicon.png" />
  <link rel="stylesheet" href="/src/css/index.css" />
</head>

<body>
  <!-- Portfolio Selection Screen -->
  <div id="portfolio-selection">
    <div class="selection-container">
      <h1 class="selection-title">Choose Your Experience</h1>
      <p class="selection-subtitle">Welcome to Zied Harzallah's Portfolio</p>

      <div class="portfolio-options">
        <div class="portfolio-option" id="select-3d">
          <div class="option-icon">🚀</div>
          <h3>3D Portfolio</h3>
          <p>
            Immersive space experience with 3D astronaut and interactive
            elements
          </p>
          <button class="option-btn btn primary-btn">Explore in 3D</button>
        </div>

        <div class="portfolio-option" id="select-2d">
          <div class="option-icon">💼</div>
          <h3>Traditional Portfolio</h3>
          <p>Clean, professional layout with all projects and information</p>
          <button class="option-btn btn primary-btn">View Portfolio</button>
        </div>
      </div>

      <p class="selection-note">
        You can always switch between experiences later
      </p>
    </div>
  </div>

  <script>
    document.getElementById('select-3d').addEventListener('click', function () {
      window.location.href = '/3d-portfolio.html';
    });

    document.getElementById('select-2d').addEventListener('click', function () {
      window.location.href = '/portfolio.html';
    });
  </script>
</body>

</html>
